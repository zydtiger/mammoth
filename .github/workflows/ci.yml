name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync all extras
        run: uv sync --locked --all-extras
      - name: Commit hooks
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: "0.4.x"

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-py${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}
      - name: Sync all extras
        run: uv sync --locked --all-extras
      - name: Run manual-stage hooks
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: "0.4.x"
          extra-args: --all-files --hook-stage manual
      # The wheel does not vary by interpreter, so build and smoke-test it on
      # the lowest supported version only.
      - name: Build distributions
        if: matrix.python-version == '3.9'
        run: uv build

      - name: Install smoke test
        shell: bash
        if: matrix.python-version == '3.9'
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            uv pip install --python "$RUNNER_TEMP/smoke/Scripts/python.exe" dist/*.whl
            "$RUNNER_TEMP/smoke/Scripts/mammoth.exe" --help
          else
            uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
            "$RUNNER_TEMP/smoke/bin/mammoth" --help
          fi
