name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync all extras
        run: uv sync --locked --all-extras
      - name: Commit hooks
        run: uvx prek@0.4.14 run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}
      - name: Sync all extras
        run: uv sync --locked --all-extras
      - name: Pytest with coverage
        # Rich force-enables terminal styling when it sees GITHUB_ACTIONS, which
        # breaks plain-substring CLI output assertions; unset it so captured CLI
        # output matches local runs. GITHUB_* variables cannot be overridden via
        # the env mapping, so unset at the shell level.
        run: env -u GITHUB_ACTIONS uv run pytest --cov=mammoth --cov-report=term-missing
      - name: Build distributions
        run: uv build
