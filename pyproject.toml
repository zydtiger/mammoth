[project]
name = "mammoth"
version = "0.8.5"
description = "Project-independent orchestration, training, logging, and monitoring infrastructure for AI workloads"
readme = "README.md"
authors = [
    { name = "tigerding", email = "zhiyuanding01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer-slim>=0.24.0,<0.25",
]

[project.scripts]
mammoth = "mammoth.cli:main"

[project.optional-dependencies]
monitor = [
    "psutil>=6.1",
    "rich>=14.3.2",
    "textual>=8.2.8",
]
tensorboard = [
    "tensorboardX>=2.6.2.2",
]
torch = [
    "torch>=2.13.0,<2.14",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "psutil>=6.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "rich>=14.3.2",
    "ruff>=0.16.5",
    "textual>=8.2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents/skills"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "SIM", "UP"]
ignore = ["D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mammoth"]

[[tool.mypy.overrides]]
module = "tensorboardX"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mammoth"]

[tool.coverage.report]
show_missing = true
skip_covered = true
