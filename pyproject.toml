[project]
name = "mammoth"
version = "0.1.0"
description = "Project-independent orchestration, training, logging, and monitoring infrastructure for AI workloads"
readme = "README.md"
authors = [
    { name = "tigerding", email = "zhiyuanding01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0.2",
    "typer-slim>=0.21.2,<0.22",
]

[project.scripts]
mammoth = "mammoth.cli:main"

[project.optional-dependencies]
monitor = [
    "psutil>=6.1",
    "rich>=13.9",
]
tensorboard = [
    "tensorboardX>=2.6.2.2",
]
torch = [
    "torch>=2.2,<2.13",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "types-PyYAML>=6.0.12.20241230",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "SIM", "UP"]
ignore = ["D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mammoth"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mammoth"]

[tool.coverage.report]
show_missing = true
skip_covered = true
